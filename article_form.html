<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Article</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Mon Blog </span>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2> Ajouter un Article</h2>
                <a href="index.php" class="btn btn-outline-secondary btn-sm">Retour à l'accueil</a>
            </div>

            <form action="article_process.php" method="POST" class="card p-4 shadow-sm">
                <div class="mb-3">
                    <label class="form-label">Titre de l'article</label>
                    <input type="text" name="titre" class="form-control" placeholder="Titre de l'article" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contenu de l'article</label>
                    <textarea name="contenu" rows="6" class="form-control" placeholder="Contenu de l'article" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Votre nom</label>
                    <input type="text" name="auteur" class="form-control" placeholder="Votre nom" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Categorie</label>
                    <select name="categorie" class="form-select" required>
                        <option value="">-- Sélectionnez une catégorie --</option>
                        <option value="Tutoriels">Tutoriels</option>
                        <option value="Ressources">Ressources</option>
                        <option value="Actualités">Actualités</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Date de publication</label>
                    <input type="date" name="date" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Publier l'article</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
