<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S'inscrire - WebDev</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <div class="navbar-nav">
            <a class="nav-link" href="#">🏠 Retour au blog</a>
            <a class="nav-link" href="#">📧 Contactez-nous</a>
            <a class="nav-link" href="#">📝 Ajouter un article</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title mb-4">📩 S'inscrire</h2>
                    
                    <form action="signup_process.php" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Nom d'utilisateur</label>
                            <input type="text" name="username" class="form-control" placeholder="Entre 3 et 20 caractères (lettres, chiffres, tirets)" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Adresse email</label>
                            <input type="email" name="email" class="form-control" placeholder="exemple@domain.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mot de passe</label>
                            <input type="password" name="password" class="form-control" placeholder="Minimum 8 caractères" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirmer le mot de passe</label>
                            <input type="password" name="password_confirm" class="form-control" placeholder="Doit être identique" required>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" name="terms" class="form-check-input" id="terms" required>
                            <label class="form-check-label" for="terms">Vous devez accepter les conditions</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">✔️ S'inscrire</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="alert alert-info">
                <h5>Conseils pour chaque champ</h5>
                <p><small>Assurez-vous que votre mot de passe est fort et que votre nom d'utilisateur ne contient pas de caractères spéciaux non autorisés.</small></p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
